name: CI

# Porte de qualité rapide : lint, tests et build à chaque pull request et à chaque
# push sur les branches d'intégration (develop) et de production (main).
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint et tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
        env:
          # En CI on utilise le conteneur Mongo ci-dessus : inutile de télécharger un binaire.
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - name: Lint
        run: npm run lint
      - name: Tests Jest + Supertest
        run: npm test
        env:
          MONGO_URI_TEST: mongodb://127.0.0.1:27017

  frontend:
    name: Frontend - lint et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build de production
        run: npm run build

  images:
    name: Images Docker - construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image de l'API
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: taskflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Construire l'image du front
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: taskflow-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
